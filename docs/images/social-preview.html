<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capri — GitHub social preview</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #070811; }
  .cover {
    position: relative; width: 1280px; height: 640px; overflow: hidden;
    color: #f3f5fb; font-family: Inter, "DejaVu Sans", Arial, sans-serif;
    background-image:
      linear-gradient(90deg, rgba(7,8,17,.22) 0%, rgba(7,8,17,.08) 48%, rgba(7,8,17,0) 100%),
      url("capri-hero.jpg");
    background-size: cover; background-position: center;
  }
  .cover::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(7,8,17,.62) 0%, rgba(7,8,17,.28) 45%, transparent 74%); }
  .cover::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px; background: linear-gradient(90deg, #5df4e5, #fb4c98 72%, #9b73ff); }
  .content { position: absolute; z-index: 1; left: 76px; top: 78px; width: 620px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 12px; border: 1px solid rgba(93,244,229,.55); border-radius: 999px; padding: 11px 19px; color: #85f5e8; font-size: 14px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; background: rgba(6,12,25,.5); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #7df3dc; box-shadow: 0 0 12px #5df4e5; }
  h1 { margin: 56px 0 4px -7px; font-size: 132px; line-height: .95; font-weight: 850; letter-spacing: -7px; color: #f7f7fd; text-shadow: 0 8px 40px rgba(0,0,0,.35); }
  .subtitle { margin: 19px 0 0; font-size: 32px; line-height: 1.2; font-weight: 650; letter-spacing: -.7px; }
  .details { margin: 22px 0 0; color: #c1c8d7; font-size: 19px; line-height: 1.65; }
  .footer { position: absolute; z-index: 1; left: 77px; bottom: 45px; display: flex; align-items: center; gap: 12px; color: #9aa5ba; font-size: 13px; font-weight: 700; letter-spacing: 2px; }
  .footer-mark { width: 24px; height: 2px; background: #fb4c98; box-shadow: 0 0 12px #fb4c98; }
  .runtime { position: absolute; z-index: 1; right: 38px; top: 34px; color: rgba(235,242,255,.72); font-size: 12px; font-weight: 700; letter-spacing: 2px; }
</style>
</head>
<body>
  <main class="cover" aria-label="Capri — локальний AI-компаньйон">
    <div class="content">
      <div class="eyebrow"><span class="dot"></span> ЛОКАЛЬНО · ПІД КОНТРОЛЕМ ВЛАСНИКА</div>
      <h1>CAPRI</h1>
      <p class="subtitle">Локальний AI-компаньйон</p>
      <p class="details">Пам’ять зі згодою · інструменти з підтвердженням<br>Desktop · Web · TUI · голосовий стек</p>
    </div>
    <div class="footer"><span class="footer-mark"></span> ПРИВАТНІСТЬ · КОНТРОЛЬ · LOCAL-FIRST</div>
    <div class="runtime">B-12 RUNTIME</div>
  </main>
</body>
</html>
