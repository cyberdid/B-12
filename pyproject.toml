[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "b12-runtime"
version = "0.1.0"
description = "Локальне ядро компаньйона B-12"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "numpy>=1.26,<3",
  "pymorphy3>=2.0,<3",
  "pymorphy3-dicts-uk>=2.4",
  "pymorphy3-dicts-ru>=2.4",
  "tokenizers>=0.21,<1",
  "jinja2>=3.1.6,<4",
]

[project.scripts]
b12 = "b12.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]
tui = [
    "pillow>=13,<14",
    "textual>=8,<9",
    "textual-image>=0.14,<0.15",
]
voice = [
  "faster-whisper>=1.1,<2",
  "onnxruntime>=1.19,<2",
  "piper-tts>=1.2,<2",
  "soundfile>=0.12,<1",
]
desktop = ["PySide6-Essentials>=6.8,<7", "pillow>=13,<14"]

[tool.hatch.build.targets.wheel]
packages = ["src/b12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
markers = ["real_model: requires an explicitly enabled local model", "hardware: requires physical hardware"]

[tool.ruff]
# Preserve exact reviewed upstream bytes; adapter remains linted.
extend-exclude = ["src/b12/_vendor/archive_index"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Eval corpus prompts are data; wrapping them would change the case text.
"evals/build_cases.py" = ["E501"]
