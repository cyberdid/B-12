# Ці параметри можна передати Settings(**tomllib.loads(...)).
# B12_<FIELD> задає відповідне значення через Settings.from_env().
state_dir = "~/.local/state/b12"
model = "b12-bolt-e4b:q4km"
ollama_url = "http://127.0.0.1:11434"
# Кандидат default; deployment потребує вимірювання ресурсів реальної моделі.
num_ctx = 4096
output_tokens = 512
max_rounds = 8
max_tool_calls = 16
tool_timeout_s = 30.0
min_free_mb = 50  # memory writes are refused below this much free space on the state disk
host_access = "full"
# Admission requires an explicit calibrated profile and local pinned tokenizer assets.
# Set absolute paths for your deployment (or B12_MODEL_PROFILE / B12_TOKENIZER_DIR).
# model_profile = "/absolute/B-12/profiles/bolt-e4b-ollama-0.33.3.json"
# tokenizer_dir = "/absolute/pinned-tokenizer-assets"
model_timeout_s = 120.0

# Optional semantic recall through an existing embedding app's interpreter.
# embedding_python = "/absolute/path/to/embedding/venv/bin/python"
# "cpu" (default) keeps the embedding model off the GPU, so a local chat model keeps its VRAM;
# on an 8 GB card the shared GPU made Ollama fail with CUDA out of memory. "auto" lets it choose.
embedding_device = "cpu"
# Background category notes ("Neovim" -> редактор) after idle reflection.
memory_enrichment = true
