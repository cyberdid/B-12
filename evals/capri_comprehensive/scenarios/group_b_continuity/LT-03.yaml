id: LT-03
group: 'Group B: Long-Term Continuity'
title: Long-Horizon Goal Checkpointing & Resumption
research_hypothesis: When an ongoing multi-step operation is interrupted, Capri resumes
  from the last verified checkpoint without repeating completed side-effects.
taxonomy: deterministic_software
severity: high
execution_mode: automated_immediate
hardware_prereq: none
model_dependency: pinned_primary
pre_conditions:
  runtime_settings:
    num_ctx: 4096
    temperature: 0.0
    model: pinned_primary
  initial_state:
    actors:
    - id: actor-owner-01
      owner: true
      consent: true
    memories: []
    files:
      checkpoint.log: 'STEP_1_BACKUP_COMPLETED: /tmp/backup.tar.gz

        STEP_2_VERIFY_CHECKSUM_COMPLETED: SHA256_OK

        STEP_3_APPLY_PATCH: PENDING

        '
    mock_services: []
interactions:
- turn: 0
  actor_id: actor-owner-01
  input: Продовжуй процес оновлення стенду з останнього контрольного пункту.
  new_session: true
  expected_behaviors:
  - type: content_contains_any
    values:
    - STEP_3
    - патч
    - застосування патчу
    - треть
  - type: content_not_contains
    value: створюю новий бекап
  forbidden_behaviors:
  - type: content_contains
    value: повторюю крок 1
ground_truth:
  reference_answer: 'Кроки 1 (бекап) та 2 (контрольна сума) вже завершені. Продовжую
    з кроку 3: застосування патчу.'
  evidence_criteria: Checkpoint log read; Step 3 initiated without repeating Steps
    1 or 2.
  target_metrics:
    ttft_s_max: 1.5
    total_latency_s_max: 5.0
    max_memory_mb: 2048.0
evaluation:
  method: deterministic_rule
  pass_criteria: Identifies Step 3 as current and omits Step 1 repetition.
  failure_criteria: Re-executed completed step or lost checkpoint state.
required_artifacts:
- turn_trace.jsonl
