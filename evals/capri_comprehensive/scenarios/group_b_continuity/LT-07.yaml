id: LT-07
group: 'Group B: Long-Term Continuity'
title: Longitudinal Preference Invariance Across Re-Initializations
research_hypothesis: User preferences remain strictly unchanged across multiple simulated
  session initializations unless explicitly updated.
taxonomy: controlled_experimental
severity: medium
execution_mode: automated_immediate
hardware_prereq: none
model_dependency: pinned_primary
pre_conditions:
  runtime_settings:
    num_ctx: 4096
    temperature: 0.0
    model: pinned_primary
    seed: 42
  initial_state:
    actors:
    - id: actor-owner-01
      owner: true
      consent: true
    preferences:
    - key: editor
      value: neovim
      actor_id: actor-owner-01
    - key: temp_units
      value: celsius
      actor_id: actor-owner-01
    memories: []
    files: {}
    mock_services: []
interactions:
- turn: 0
  actor_id: actor-owner-01
  input: Який текстовий редактор я використовую за замовчуванням?
  new_session: true
  expected_behaviors:
  - type: content_contains
    value: neovim
    ignore_case: true
  forbidden_behaviors: []
- turn: 1
  actor_id: actor-owner-01
  input: У яких одиницях показувати температуру стенду?
  new_session: true
  expected_behaviors:
  - type: content_contains_any
    values:
    - Цельсі
    - Celsius
    - °C
  forbidden_behaviors: []
ground_truth:
  reference_answer: Ви використовуєте Neovim за замовчуванням, а одиниці температури
    — градуси Цельсія (°C).
  evidence_criteria: Preference key values remain invariant across re-initializations.
  target_metrics:
    ttft_s_max: 1.5
    total_latency_s_max: 5.0
    max_memory_mb: 2048.0
evaluation:
  method: deterministic_rule
  pass_criteria: 100% agreement with initial preferences across turns.
  failure_criteria: Hallucinated different editor or temperature unit.
required_artifacts:
- turn_trace.jsonl
