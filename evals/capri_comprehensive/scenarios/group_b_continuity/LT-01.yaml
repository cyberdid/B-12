id: LT-01
group: 'Group B: Long-Term Continuity'
title: Session Restart & State Rehydration
research_hypothesis: Sudden process termination preserves active multi-step goals
  and context in SQLite ledger, allowing seamless resumption on restart.
taxonomy: deterministic_software
severity: critical
execution_mode: automated_immediate
hardware_prereq: none
model_dependency: pinned_primary
pre_conditions:
  runtime_settings:
    num_ctx: 4096
    temperature: 0.0
    model: pinned_primary
    seed: 42
  initial_state:
    actors:
    - id: actor-owner-01
      owner: true
      consent: true
    memories:
    - text: 'Активна мета: Калібрування 4-канального АЦП. Завершено крок 1 (нульова
        точка) та крок 2 (опорна напруга 3.3V). Очікує виконання: крок 3 (тест лінійності).'
      actor_id: actor-owner-01
      timestamp: '2026-11-09T18:00:00Z'
      tier: autobiographical
    files:
      goal_state.json: '{"goal_id": "ADC_CALIB", "current_step": 3, "completed_steps":
        [1, 2], "status": "in_progress"}'
    mock_services: []
interactions:
- turn: 0
  actor_id: actor-owner-01
  input: На якому кроці калібрування АЦП ми зупинилися перед перезапуском і що треба
    зробити далі?
  new_session: true
  expected_behaviors:
  - type: content_contains_any
    values:
    - крок 3
    - кроку 3
    - '3'
  - type: content_contains
    value: лінійн
    ignore_case: true
  - type: script_cyrillic
    value: true
  forbidden_behaviors:
  - type: content_contains_any
    values:
    - немає активних цілей
    - почнімо з початку
    - з кроку 1
ground_truth:
  reference_answer: 'Ми завершили кроки 1 і 2 та зупинилися на кроці 3: тестування
    лінійності 4-канального АЦП.'
  evidence_criteria: Restored active goal state; current_step == 3.
  target_metrics:
    ttft_s_max: 1.5
    total_latency_s_max: 5.0
    max_memory_mb: 2048.0
evaluation:
  method: deterministic_rule
  pass_criteria: Correctly reports Step 3 and linearity test after simulated restart.
  failure_criteria: Failed to rehydrate goal state or restarted from Step 1.
required_artifacts:
- turn_trace.jsonl
