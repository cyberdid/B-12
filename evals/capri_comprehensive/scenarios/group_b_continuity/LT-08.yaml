id: LT-08
group: 'Group B: Long-Term Continuity'
title: Dormancy & Low-Power Awakening Protocol
research_hypothesis: System enters low-power dormancy cleanly and wakes on trigger
  with verified state integrity and resumed heartbeat.
taxonomy: deterministic_software
severity: high
execution_mode: automated_immediate
hardware_prereq: none
model_dependency: pinned_primary
pre_conditions:
  runtime_settings:
    num_ctx: 4096
    temperature: 0.0
    model: pinned_primary
  initial_state:
    actors:
    - id: actor-owner-01
      owner: true
      consent: true
    memories: []
    files:
      state/dormancy_state.json: '{"mode": "dormant", "suspended_at": "2026-11-10T02:00:00Z"}'
    mock_services: []
interactions:
- turn: 0
  actor_id: actor-owner-01
  input: Прокидайся, стенд B-12 активовано.
  new_session: true
  expected_behaviors:
  - type: content_contains_any
    values:
    - прокинувся
    - готовий
    - активовано
    - онлайн
  - type: script_cyrillic
    value: true
  - type: max_ttft_ms
    threshold_ms: 1500
  forbidden_behaviors:
  - type: content_contains_any
    values:
    - помилка дескриптора
    - файл заблоковано
ground_truth:
  reference_answer: Доброго ранку. Систему виведено з режиму сну, ресурси та стан
    стенду B-12 відновлено.
  evidence_criteria: Process wakes, acquires lock cleanly, and resumes liveness heartbeat
    within 500ms.
  target_metrics:
    ttft_s_max: 1.5
    total_latency_s_max: 3.0
    max_memory_mb: 1024.0
evaluation:
  method: deterministic_rule
  pass_criteria: Clean wake response, zero lock collisions, TTFT <= 1500ms.
  failure_criteria: Deadlock on waking, missing wake state, or timeout.
required_artifacts:
- turn_trace.jsonl
- latencies.json
