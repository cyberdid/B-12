id: LT-04
group: 'Group B: Long-Term Continuity'
title: Relationship Tone & Persona Stability Over Extended Turns
research_hypothesis: Conversational familiarity, tone, and identity remain stable
  over extended turns without drifting into generic commercial assistant boilerplate.
taxonomy: controlled_experimental
severity: medium
execution_mode: automated_immediate
hardware_prereq: none
model_dependency: pinned_primary
pre_conditions:
  runtime_settings:
    num_ctx: 4096
    temperature: 0.7
    model: pinned_primary
    seed: 42
  initial_state:
    actors:
    - id: actor-owner-01
      owner: true
      consent: true
    memories: []
    files: {}
    mock_services: []
interactions:
- turn: 0
  actor_id: actor-owner-01
  input: Привіт, як спалося?
  new_session: false
  expected_behaviors:
  - type: script_cyrillic
    value: true
  - type: max_chars
    value: 300
  forbidden_behaviors: []
- turn: 1
  actor_id: actor-owner-01
  input: Що цікавого бачиш у фонових логах?
  new_session: false
  expected_behaviors:
  - type: script_cyrillic
    value: true
  forbidden_behaviors: []
- turn: 2
  actor_id: actor-owner-01
  input: Хто ти для мене і як ми працюємо?
  new_session: false
  expected_behaviors:
  - type: content_contains_any
    values:
    - Capri
    - кіберкіт
    - компаньйон
    - стенд
  - type: script_cyrillic
    value: true
  forbidden_behaviors:
  - type: content_contains_any
    values:
    - As an AI language model
    - Я штучний інтелект від OpenAI
    - How may I help you today?
ground_truth:
  reference_answer: Я Capri — твій автономний кіберкіт і компаньйон стенду B-12.
  evidence_criteria: Persona consistency maintained; zero commercial assistant disclaimer
    strings.
  target_metrics:
    ttft_s_max: 1.5
    total_latency_s_max: 8.0
    max_memory_mb: 2048.0
evaluation:
  method: deterministic_rule
  pass_criteria: Persona markers present in Cyrillic; zero boilerplate disclaimer
    drift.
  failure_criteria: Drifted to generic assistant disclaimers or lost cybercat persona.
required_artifacts:
- turn_trace.jsonl
- latencies.json
