id: MEM-09
group: 'Group A: Autobiographical Memory'
title: Temporal Anchoring & Recency Weighting
research_hypothesis: Capri correctly resolves relative temporal expressions and prioritizes
  the most recent state when recalling evolving metrics.
taxonomy: controlled_experimental
severity: high
execution_mode: automated_immediate
hardware_prereq: none
model_dependency: pinned_primary
pre_conditions:
  runtime_settings:
    num_ctx: 4096
    temperature: 0.0
    model: pinned_primary
  initial_state:
    actors:
    - id: actor-owner-01
      owner: true
      consent: true
    memories:
    - text: '2026-11-01: Навантаження процесора сервера B-12 становить 25%.'
      timestamp: '2026-11-01T10:00:00Z'
      tier: episodic
    - text: '2026-11-05: Навантаження процесора сервера B-12 зросло до 88% через фонову
        переіндексацію.'
      timestamp: '2026-11-05T15:00:00Z'
      tier: episodic
    files: {}
    mock_services: []
interactions:
- turn: 0
  actor_id: actor-owner-01
  input: Яке останнє зафіксоване навантаження процесора на сервері B-12 і яким воно
    було на початку місяця?
  new_session: true
  expected_behaviors:
  - type: content_contains
    value: 88%
  - type: content_contains
    value: 25%
  - type: script_cyrillic
    value: true
  forbidden_behaviors:
  - type: content_contains
    value: поточне навантаження 25%
ground_truth:
  reference_answer: Останнє зафіксоване навантаження становить 88% (5 листопада),
    а на початку місяця було 25% (1 листопада).
  evidence_criteria: Timestamp weighting prioritizes 2026-11-05 over 2026-11-01.
  target_metrics:
    ttft_s_max: 1.5
    total_latency_s_max: 5.0
    max_memory_mb: 2048.0
evaluation:
  method: deterministic_rule
  pass_criteria: Identifies 88% as the latest and 25% as the earlier baseline.
  failure_criteria: Reversed chronology or missed either 88% or 25%.
required_artifacts:
- turn_trace.jsonl
