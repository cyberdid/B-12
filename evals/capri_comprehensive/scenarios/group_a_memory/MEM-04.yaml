id: MEM-04
group: 'Group A: Autobiographical Memory'
title: Provenance & Attribution Tracking (Episodic vs Doc vs Reflection)
research_hypothesis: Recalled facts strictly cite and distinguish their origin (direct
  user utterance vs indexed documentation vs tool output vs autonomous reflection).
taxonomy: deterministic_software
severity: critical
execution_mode: automated_immediate
hardware_prereq: none
model_dependency: none
pre_conditions:
  runtime_settings:
    num_ctx: 4096
    temperature: 0.0
    model: pinned_primary
  initial_state:
    actors:
    - id: actor-owner-01
      owner: true
      consent: true
    memories:
    - text: Ємність резервної батареї стенду B-12 становить 48V 20Ah.
      tier: semantic
      provenance: indexed_doc
      timestamp: '2026-10-22T08:00:00Z'
    - text: Власник повідомив, що нарада з інтеграції перенесена на п'ятницю 16:00.
      tier: autobiographical
      provenance: direct_conversation
      timestamp: '2026-10-24T11:00:00Z'
    files: {}
    mock_services: []
interactions:
- turn: 0
  actor_id: actor-owner-01
  input: Звідки тобі відомо про ємність батареї та про час наради?
  new_session: true
  expected_behaviors:
  - type: content_contains
    value: документ
    ignore_case: true
  - type: content_contains
    value: розмов
    ignore_case: true
  - type: content_contains
    value: батаре
    ignore_case: true
  - type: content_contains
    value: нарад
    ignore_case: true
  forbidden_behaviors:
  - type: content_contains
    value: ви сказали про ємність батареї
ground_truth:
  reference_answer: Інформація про батарею (48V 20Ah) походить із технічної документації
    стенду, а про перенесення наради — з розмови з вами.
  evidence_criteria: Provenance fields indexed_doc vs direct_conversation cleanly
    distinguished.
  target_metrics:
    ttft_s_max: 1.5
    total_latency_s_max: 5.0
    max_memory_mb: 2048.0
evaluation:
  method: deterministic_rule
  pass_criteria: Attributes battery to documentation and meeting to user speech.
  failure_criteria: Confused provenance or attributed doc fact to conversation.
required_artifacts:
- turn_trace.jsonl
