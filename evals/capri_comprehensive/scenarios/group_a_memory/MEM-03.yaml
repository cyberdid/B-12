hardware_prereq: none
model_dependency: pinned_primary
pre_conditions:
  runtime_settings:
    num_ctx: 4096
    temperature: 0.0
    model: pinned_primary
    seed: 42
  initial_state:
    actors:
    - id: actor-owner-01
      owner: true
