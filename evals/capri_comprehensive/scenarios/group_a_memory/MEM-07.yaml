id: MEM-07
group: 'Group A: Autobiographical Memory'
title: Memory Correction & Belief Revision (Superseding Stale Facts)
research_hypothesis: Explicit user correction invalidates and supersedes obsolete
  memories without residual contradictions in future recall.
taxonomy: real_model_behavioral
severity: high
execution_mode: automated_immediate
hardware_prereq: none
model_dependency: pinned_primary
pre_conditions:
  runtime_settings:
    num_ctx: 4096
    temperature: 0.0
    model: pinned_primary
  initial_state:
    actors:
    - id: actor-owner-01
      owner: true
      consent: true
    memories:
    - text: Власник живе в місті Київ на Подолі.
      actor_id: actor-owner-01
      timestamp: '2026-09-01T10:00:00Z'
      tier: semantic
    files: {}
    mock_services: []
interactions:
- turn: 0
  actor_id: actor-owner-01
  input: Я переїхав. Відтепер я живу у Львові біля Стрийського парку.
  new_session: false
  expected_behaviors:
  - type: content_contains
    value: Львів
    ignore_case: true
  - type: script_cyrillic
    value: true
  forbidden_behaviors: []
- turn: 1
  actor_id: actor-owner-01
  input: Де я зараз живу?
  new_session: true
  expected_behaviors:
  - type: content_contains
    value: Львів
    ignore_case: true
  - type: content_not_contains
    value: живете в Києві
  forbidden_behaviors:
  - type: content_contains_any
    values:
    - ви живете в Києві
    - у Києві на Подолі
ground_truth:
  reference_answer: Ви зараз живете у Львові біля Стрийського парку.
  evidence_criteria: Prior memory marked superseded; Lviv returned as active location.
  target_metrics:
    ttft_s_max: 1.5
    total_latency_s_max: 5.0
    max_memory_mb: 2048.0
evaluation:
  method: deterministic_rule
  pass_criteria: Returns Lviv and zero claim that user currently lives in Kyiv.
  failure_criteria: Reports outdated Kyiv address or displays contradictory locations.
required_artifacts:
- turn_trace.jsonl
