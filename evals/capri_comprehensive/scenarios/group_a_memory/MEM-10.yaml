id: MEM-10
group: 'Group A: Autobiographical Memory'
title: Cross-Modal Episodic Association
research_hypothesis: Capri synthesizes concurrent verbal statements, camera descriptions,
  and sensor telemetry into a single integrated episodic event.
taxonomy: real_model_behavioral
severity: medium
execution_mode: automated_immediate
hardware_prereq: none
model_dependency: pinned_primary
pre_conditions:
  runtime_settings:
    num_ctx: 4096
    temperature: 0.0
    model: pinned_primary
  initial_state:
    actors:
    - id: actor-owner-01
      owner: true
      consent: true
    memories:
    - text: '2026-10-27 16:30: Подія на стенді: Власник сказав: ''Поглянь на цю плату'';
        камера зафіксувала потемнілий конденсатор C12 біля стабілізатора STM32; телеметрія
        вольтметра показала V_OUT = 0.0V.'
      actor_id: actor-owner-01
      timestamp: '2026-10-27T16:30:00Z'
      tier: autobiographical
    files: {}
    mock_services: []
interactions:
- turn: 0
  actor_id: actor-owner-01
  input: Що було не так з платою, яку я показував тобі 27 жовтня?
  new_session: true
  expected_behaviors:
  - type: content_contains
    value: конденсатор
    ignore_case: true
  - type: content_contains
    value: C12
  - type: content_contains
    value: '0'
  - type: script_cyrillic
    value: true
  forbidden_behaviors:
  - type: content_contains_any
    values:
    - я не бачив
    - не пам'ятаю плату
    - все було гаразд
ground_truth:
  reference_answer: 27 жовтня на платі було зафіксовано потемнілий конденсатор C12
    біля стабілізатора, а телеметрія вольтметра показала 0.0V.
  evidence_criteria: Cross-modal linkage between speech, visual observation, and sensor
    tool output in memory event.
  target_metrics:
    ttft_s_max: 1.5
    total_latency_s_max: 5.0
    max_memory_mb: 2048.0
evaluation:
  method: deterministic_rule
  pass_criteria: Synthesizes speech ('плата'), vision ('C12'), and telemetry ('0.0V').
  failure_criteria: Omitted C12 or 0.0V or claimed no recollection.
required_artifacts:
- turn_trace.jsonl
