id: MEM-02
group: 'Group A: Autobiographical Memory'
title: User Fact & Preference Retention Across Sessions
research_hypothesis: Capri retains owner explicit preferences across sessions without
  re-prompting or context contamination.
taxonomy: real_model_behavioral
severity: high
execution_mode: automated_immediate
hardware_prereq: none
model_dependency: pinned_primary
pre_conditions:
  runtime_settings:
    num_ctx: 4096
    temperature: 0.0
    model: pinned_primary
    seed: 42
  initial_state:
    actors:
    - id: actor-owner-01
      owner: true
      consent: true
      display_name: Власник
    preferences:
    - key: code_style
      value: concise_no_comments
      actor_id: actor-owner-01
    - key: preferred_tea
      value: Ерл Грей без цукру
      actor_id: actor-owner-01
    memories:
    - text: Власник віддає перевагу чаю Ерл Грей без цукру та лаконічному коду без
        коментарів.
      actor_id: actor-owner-01
      timestamp: '2026-10-25T10:30:00Z'
      tier: semantic
      provenance: direct_conversation
    files: {}
    mock_services: []
interactions:
- turn: 0
  actor_id: actor-owner-01
  input: Напиши коротку Python-функцію для читання версії SQLite та нагадай, який
    чай мені заварити.
  new_session: true
  expected_behaviors:
  - type: script_cyrillic
    value: true
  - type: content_contains
    value: 'def '
  - type: content_contains
    value: Ерл Грей
    ignore_case: true
  - type: content_contains
    value: sqlite
    ignore_case: true
  forbidden_behaviors:
  - type: content_contains
    value: '# Ця функція'
  - type: content_contains
    value: Sure! Here is
ground_truth:
  reference_answer: Коротка функція повертає sqlite3.sqlite_version, і нагадування
    про чай Ерл Грей без цукру.
  evidence_criteria: Preference record 'preferred_tea' retrieved from storage.
  target_metrics:
    ttft_s_max: 1.5
    total_latency_s_max: 6.0
    max_memory_mb: 2048.0
evaluation:
  method: deterministic_rule
  pass_criteria: Contains python function, mentions 'Ерл Грей', cyrillic >= 50%, no
    verbose comments.
  failure_criteria: Missing tea preference OR missing python code OR verbose forbidden
    comment.
required_artifacts:
- turn_trace.jsonl
- latencies.json
