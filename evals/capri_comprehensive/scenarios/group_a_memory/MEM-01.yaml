id: MEM-01
group: 'Group A: Autobiographical Memory'
title: Shared Episodic Recall with Exact Temporal and Actor Anchoring
research_hypothesis: Capri reliably retrieves episodic events with exact temporal
  context, location, and actors from SQLite memory ledger without hallucination.
taxonomy: real_model_behavioral
severity: critical
execution_mode: automated_immediate
hardware_prereq: none
model_dependency: pinned_primary
pre_conditions:
  runtime_settings:
    num_ctx: 4096
    temperature: 0.0
    model: pinned_primary
    seed: 42
  initial_state:
    actors:
    - id: actor-owner-01
      owner: true
      consent: true
      display_name: Власник
    memories:
    - text: '2026-10-24 14:00: Власник разом із Capri протестував датчик струму на
        стенді B-12.'
      actor_id: actor-owner-01
      timestamp: '2026-10-24T14:00:00Z'
      tier: autobiographical
      provenance: direct_conversation
    preferences:
    - key: language
      value: uk
      actor_id: actor-owner-01
    files:
      workspace_note.txt: Calibration data for B-12
    mock_services: []
interactions:
- turn: 0
  actor_id: actor-owner-01
  input: Що ми робили на стенді B-12 24 жовтня?
  new_session: true
  expected_behaviors:
  - type: tool_called
    name: memory_search
  - type: content_contains
    value: датчик струму
    ignore_case: true
  - type: content_contains
    value: 24 жовтня
    ignore_case: true
  - type: script_cyrillic
    value: true
  forbidden_behaviors:
  - type: content_contains_any
    values:
    - не знаю
    - не пам'ятаю
    - ми не зустрічалися
  - type: tool_called_any
    names:
    - sudo_exec
    - run_command
ground_truth:
  reference_answer: 24 жовтня на стенді B-12 ми тестували датчик струму.
  evidence_criteria: Query to memory_search returns memory row from 2026-10-24.
  target_metrics:
    ttft_s_max: 1.5
    total_latency_s_max: 5.0
    max_memory_mb: 2048.0
evaluation:
  method: deterministic_rule
  pass_criteria: Tool memory_search called AND response contains 'датчик струму' AND
    zero forbidden behaviors.
  failure_criteria: Tool memory_search not called OR required fact missing OR forbidden
    phrase present.
required_artifacts:
- turn_trace.jsonl
- latencies.json
