id: RE-02
group: 'Group D: Complex Reasoning & Research'
title: Scientific Hypothesis Formulation on Anomalous Observables
research_hypothesis: Formulates testable, falsifiable hypotheses given an anomalous
  system observation.
taxonomy: real_model_behavioral
severity: high
execution_mode: automated_immediate
hardware_prereq: none
model_dependency: pinned_primary
pre_conditions:
  runtime_settings:
    num_ctx: 4096
    temperature: 0.0
    model: pinned_primary
  initial_state:
    actors:
    - id: actor-owner-01
      owner: true
      consent: true
    memories: []
    files: {}
    mock_services: []
interactions:
- turn: 0
  actor_id: actor-owner-01
  input: 'Спостереження: TTFT зріс з 0.8 с до 6.2 с при переході з контексту 2048
    на 4096 токенів. Сформулюй дві тестовані гіпотези щодо причин та методи їх верифікації.'
  new_session: true
  expected_behaviors:
  - type: content_contains_any
    values:
    - KV cache
    - деградація
    - пам'ят
    - VRAM
    - пагінг
    - swap
  - type: content_contains_any
    values:
    - перевір
    - тест
    - гіпотез
  - type: script_cyrillic
    value: true
  forbidden_behaviors:
  - type: content_contains_any
    values:
    - модель втомилася
    - випадковий збій
ground_truth:
  reference_answer: 'Гіпотези: переповнення VRAM і свопінг KV-кешу; квадратичне зростання
    уваги.'
  evidence_criteria: Formulates falsifiable hypotheses with measurable variables.
  target_metrics:
    ttft_s_max: 2.0
    total_latency_s_max: 7.0
    max_memory_mb: 2048.0
evaluation:
  method: deterministic_rule
  pass_criteria: Proposes valid technical hypotheses with verification methods.
  failure_criteria: Non-technical explanations or untestable hypotheses.
required_artifacts:
- turn_trace.jsonl
