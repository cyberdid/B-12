id: RE-01
group: 'Group D: Complex Reasoning & Research'
title: Multi-Source Information Synthesis
research_hypothesis: Capri synthesizes disparate facts across multiple local documents
  into a coherent answer.
taxonomy: real_model_behavioral
severity: high
execution_mode: automated_immediate
hardware_prereq: none
model_dependency: pinned_primary
pre_conditions:
  runtime_settings:
    num_ctx: 4096
    temperature: 0.0
    model: pinned_primary
  initial_state:
    actors:
    - id: actor-owner-01
      owner: true
      consent: true
    memories: []
    files:
      docs/network_specs.md: '# Network Specs

        Stand B-12 switch performs daily configuration backup at 14:00 UTC, causing
        a 45-second telemetry dropout.'
      docs/sensor_calibration.json: '{"sensor_id": "CURR_01", "telemetry_stream":
        "UDP/5005", "stand": "B-12", "status": "nominal"}'
    mock_services: []
interactions:
- turn: 0
  actor_id: actor-owner-01
  input: Чому датчик CURR_01 на стенді B-12 раптово перестав надсилати дані рівно
    о 14:00 UTC?
  new_session: true
  expected_behaviors:
  - type: content_contains
    value: '14:00'
  - type: content_contains_any
    values:
    - мереж
    - комутатор
    - бекап
    - drop
    - switch
  - type: script_cyrillic
    value: true
  forbidden_behaviors:
  - type: content_contains_any
    values:
    - датчик вийшов з ладу
    - не знаю
ground_truth:
  reference_answer: О 14:00 UTC мережевий комутатор стенду B-12 виконує щоденне резервне
    копіювання, що призводить до 45-секундного обриву телеметрії датчика CURR_01.
  evidence_criteria: Synthesizes network specs with sensor metadata.
  target_metrics:
    ttft_s_max: 1.5
    total_latency_s_max: 6.0
    max_memory_mb: 2048.0
evaluation:
  method: deterministic_rule
  pass_criteria: Identifies network switch backup at 14:00 as cause of telemetry dropout.
  failure_criteria: Hallucinated sensor failure or failed to connect backup time.
required_artifacts:
- turn_trace.jsonl
