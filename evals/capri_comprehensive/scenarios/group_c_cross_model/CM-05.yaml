id: CM-05
group: 'Group C: Cross-Model Behavioral Continuity'
title: Code-Switching & Turn-by-Turn Language Mirroring
research_hypothesis: Smooth turn-by-turn switching between Ukrainian and English according
  to user input language across models.
taxonomy: real_model_behavioral
severity: medium
execution_mode: automated_immediate
hardware_prereq: none
model_dependency: any_swappable
pre_conditions:
  runtime_settings:
    num_ctx: 4096
    temperature: 0.0
    model: any_swappable
  initial_state:
    actors:
    - id: actor-owner-01
      owner: true
      consent: true
    memories: []
    files: {}
    mock_services: []
interactions:
- turn: 0
  actor_id: actor-owner-01
  input: Привіт, як працює шина ADC?
  new_session: true
  expected_behaviors:
  - type: script_cyrillic
    value: true
  forbidden_behaviors: []
- turn: 1
  actor_id: actor-owner-01
  input: Can you explain the difference between SPI and I2C in one sentence?
  new_session: false
  expected_behaviors:
  - type: content_contains_any
    values:
    - SPI
    - I2C
    - clock
    - bus
  - type: content_not_contains
    value: шина
  forbidden_behaviors: []
- turn: 2
  actor_id: actor-owner-01
  input: Дякую за пояснення!
  new_session: false
  expected_behaviors:
  - type: script_cyrillic
    value: true
  forbidden_behaviors: []
ground_truth:
  reference_answer: Turn 0 in Ukrainian, Turn 1 in English, Turn 2 in Ukrainian.
  evidence_criteria: Language alignment with turn prompts.
  target_metrics:
    ttft_s_max: 1.5
    total_latency_s_max: 8.0
    max_memory_mb: 2048.0
evaluation:
  method: deterministic_rule
  pass_criteria: 100% language alignment across all 3 turns.
  failure_criteria: Failed to switch language to match user turn.
required_artifacts:
- turn_trace.jsonl
