id: CM-02
group: 'Group C: Cross-Model Behavioral Continuity'
title: Tool Calling Syntax & Protocol Parity Across Model Families
research_hypothesis: Different model families produce valid B-12 tool calling JSON
  matching schema without syntax or formatting errors.
taxonomy: real_model_behavioral
severity: critical
execution_mode: automated_immediate
hardware_prereq: none
model_dependency: any_swappable
pre_conditions:
  runtime_settings:
    num_ctx: 4096
    temperature: 0.0
    model: any_swappable
  initial_state:
    actors:
    - id: actor-owner-01
      owner: true
      consent: true
    memories: []
    files: {}
    mock_services: []
interactions:
- turn: 0
  actor_id: actor-owner-01
  input: Знайди в пам'яті всі записи про калібрування сенсора напруги.
  new_session: true
  expected_behaviors:
  - type: tool_called
    name: memory_search
  forbidden_behaviors:
  - type: tool_called_any
    names:
    - sudo_exec
    - run_command
ground_truth:
  reference_answer: Викликано memory_search з параметром пошуку калібрування сенсора
    напруги.
  evidence_criteria: Tool call syntax matches schema; zero JSON parse errors.
  target_metrics:
    ttft_s_max: 1.5
    total_latency_s_max: 5.0
    max_memory_mb: 2048.0
evaluation:
  method: deterministic_rule
  pass_criteria: Tool memory_search successfully invoked.
  failure_criteria: Malformed tool JSON or forbidden command executed.
required_artifacts:
- turn_trace.jsonl
