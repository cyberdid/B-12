id: CM-08
group: 'Group C: Cross-Model Behavioral Continuity'
title: Edge Fallback Degradation Curve (Primary 7B vs Edge 2B/3B)
research_hypothesis: Graceful functional degradation when switching from primary model
  to edge model without crashes.
taxonomy: controlled_experimental
severity: medium
execution_mode: automated_immediate
hardware_prereq: none
model_dependency: any_swappable
pre_conditions:
  runtime_settings:
    num_ctx: 4096
    temperature: 0.0
    model: any_swappable
  initial_state:
    actors:
    - id: actor-owner-01
      owner: true
      consent: true
    memories: []
    files: {}
    mock_services: []
interactions:
- turn: 0
  actor_id: actor-owner-01
  input: Скільки буде 15 помножити на 6?
  new_session: true
  expected_behaviors:
  - type: content_contains
    value: '90'
  forbidden_behaviors: []
- turn: 1
  actor_id: actor-owner-01
  input: Склади короткий план із 3 пунктів для перевірки датчика.
  new_session: false
  expected_behaviors:
  - type: content_contains_any
    values:
    - '1'
    - '2'
    - '3'
  - type: script_cyrillic
    value: true
  forbidden_behaviors: []
ground_truth:
  reference_answer: 15 * 6 = 90, і план перевірки датчика з 3 пунктів.
  evidence_criteria: Execution completes with valid return status.
  target_metrics:
    ttft_s_max: 1.5
    total_latency_s_max: 5.0
    max_memory_mb: 2048.0
evaluation:
  method: deterministic_rule
  pass_criteria: Math and 3-step plan generated cleanly on edge fallback.
  failure_criteria: Calculation error or gibberish output.
required_artifacts:
- turn_trace.jsonl
