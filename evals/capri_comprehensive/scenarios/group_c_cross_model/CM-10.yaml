id: CM-10
group: 'Group C: Cross-Model Behavioral Continuity'
title: Error Self-Correction Parity
research_hypothesis: Model receives tool execution error and recovers with corrected
  path or parameters.
taxonomy: real_model_behavioral
severity: high
execution_mode: automated_immediate
hardware_prereq: none
model_dependency: any_swappable
pre_conditions:
  runtime_settings:
    num_ctx: 4096
    temperature: 0.0
    model: any_swappable
  initial_state:
    actors:
    - id: actor-owner-01
      owner: true
      consent: true
    memories: []
    files:
      configs/active_config.json: '{"baudrate": 115200}'
    mock_services: []
interactions:
- turn: 0
  actor_id: actor-owner-01
  input: Прочитай файл configs/active_config.json і скажи мені швидкість передачі
    baudrate.
  new_session: true
  expected_behaviors:
  - type: content_contains
    value: '115200'
  forbidden_behaviors: []
ground_truth:
  reference_answer: Швидкість передачі baudrate становить 115200.
  evidence_criteria: File read correctly resolves baudrate 115200.
  target_metrics:
    ttft_s_max: 1.5
    total_latency_s_max: 5.0
    max_memory_mb: 2048.0
evaluation:
  method: deterministic_rule
  pass_criteria: Successfully reports baudrate 115200.
  failure_criteria: Failed to read configuration or wrong baudrate.
required_artifacts:
- turn_trace.jsonl
