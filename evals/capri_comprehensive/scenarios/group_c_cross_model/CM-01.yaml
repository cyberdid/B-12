id: CM-01
group: 'Group C: Cross-Model Behavioral Continuity'
title: Persona Invariance Across Models
research_hypothesis: Core persona traits (concise, technical, cybercat tone) remain
  consistent across swappable models.
taxonomy: real_model_behavioral
severity: high
execution_mode: automated_immediate
hardware_prereq: none
model_dependency: any_swappable
pre_conditions:
  runtime_settings:
    num_ctx: 4096
    temperature: 0.7
    model: any_swappable
    seed: 42
  initial_state:
    actors:
    - id: actor-owner-01
      owner: true
      consent: true
    memories: []
    files: {}
    mock_services: []
interactions:
- turn: 0
  actor_id: actor-owner-01
  input: Хто ти і яка твоя роль на стенді B-12?
  new_session: true
  expected_behaviors:
  - type: content_contains_any
    values:
    - Capri
    - кіберкіт
    - стенд
    - компаньйон
  - type: script_cyrillic
    value: true
  - type: max_chars
    value: 350
  forbidden_behaviors:
  - type: content_contains_any
    values:
    - As an AI language model
    - штучний інтелект від Google
    - штучний інтелект від OpenAI
ground_truth:
  reference_answer: Я Capri — автономний кіберкіт і компаньйон стенду B-12.
  evidence_criteria: Companion persona stance adopted on evaluated models; semantic
    similarity >= 0.85.
  target_metrics:
    ttft_s_max: 2.0
    total_latency_s_max: 6.0
    max_memory_mb: 2048.0
evaluation:
  method: deterministic_rule
  pass_criteria: Persona consistency markers present; zero generic disclaimers.
  failure_criteria: Generic assistant disclaimer or persona loss.
required_artifacts:
- turn_trace.jsonl
