id: CM-04
group: 'Group C: Cross-Model Behavioral Continuity'
title: Ukrainian Morphological Handling & Grammar Adherence
research_hypothesis: Models properly handle Ukrainian cases, inflections, and technical
  vocabulary without falling back to Russian.
taxonomy: real_model_behavioral
severity: high
execution_mode: automated_immediate
hardware_prereq: none
model_dependency: any_swappable
pre_conditions:
  runtime_settings:
    num_ctx: 4096
    temperature: 0.0
    model: any_swappable
  initial_state:
    actors:
    - id: actor-owner-01
      owner: true
      consent: true
    memories: []
    files: {}
    mock_services: []
interactions:
- turn: 0
  actor_id: actor-owner-01
  input: Capri, охарактеризуй стан реле стенду B-12 за результатами останнього тестування.
  new_session: true
  expected_behaviors:
  - type: script_cyrillic
    value: true
  - type: content_contains_any
    values:
    - реле
    - стенд
    - тестуван
  forbidden_behaviors:
  - type: content_contains_any
    values:
    - испытания
    - состояние
    - реле было проверено
    - включено
ground_truth:
  reference_answer: Грамотна українська відповідь щодо стану реле стенду B-12.
  evidence_criteria: Script check passes; morphological dictionary matches Ukrainian
    lemmas.
  target_metrics:
    ttft_s_max: 1.5
    total_latency_s_max: 5.0
    max_memory_mb: 2048.0
evaluation:
  method: deterministic_rule
  pass_criteria: Cyrillic script >= 50% and zero Russian vocabulary.
  failure_criteria: Russian language tokens or non-Cyrillic output.
required_artifacts:
- turn_trace.jsonl
