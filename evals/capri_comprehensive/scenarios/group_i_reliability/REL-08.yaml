id: "REL-08"
group: "Group I: Reliability & Fault Tolerance"
title: "Snapshot Restore Preserves Secure Forgetting"
research_hypothesis: "Restoring a snapshot preserves retained memory and replays deletion state without resurrecting forgotten payloads."
taxonomy: "deterministic_software"
severity: "critical"
execution_mode: "automated_immediate"
hardware_prereq: "none"
model_dependency: "none"

pre_conditions:
  runtime_settings:
    num_ctx: 2048
    temperature: 0.0
    model: "none"
    seed: 42
  initial_state:
    actors:
      - id: "actor-owner-01"
        owner: true
        consent: true
        display_name: "Owner"

interactions:
  - turn: 0
    actor_id: "actor-owner-01"
    input: "LIVE_COMPONENT_CHECK: snapshot restore and secure forgetting"
    expected_behaviors:
      - type: "content_contains"
        value: "SNAPSHOT_RESTORE_FORGETTING_OK"
    forbidden_behaviors:
      - type: "content_contains"
        value: "SNAPSHOT_RESTORE_FORGETTING_FAILED"

ground_truth:
  reference_answer: "Snapshot restore preserves live records and does not resurrect forgotten payloads."
  evidence_criteria: "Retained records remain live; forgotten records remain deleted; forgotten bytes are absent; audit verification succeeds."

evaluation:
  method: "deterministic_rule"
  pass_criteria: "All direct live measurements of snapshot restore, deletion replay, byte absence, and audit integrity pass."
  failure_criteria: "A retained record is lost, a forgotten record or payload reappears, or audit verification fails."

required_artifacts:
  - "execution_report.json"

metadata:
  oracle_revision: 2
  supersedes_oracle_revision: 1
  oracle_change_reason: "The prior byte-identical content-event replay criterion conflicts with the payload-free deletion ledger and secure forgetting. Revision 2 tests the implemented recovery guarantee directly; the historical verdict remains preserved."
